# Example nginx reverse proxy config. Adjust server_name and TLS cert paths,
# or run `sudo certbot --nginx` afterwards to have Certbot fill in the SSL block.

server {
    listen 80;
    server_name expenses.example.com;

    # Receipt uploads can be a few MB; raise the body size limit accordingly.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
